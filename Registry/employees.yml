# IA Engineering — Employee Registry
#
# THE authoritative, machine-readable roster of the framework's Employees.
#
# Before this file existed, the roster was duplicated in six places:
#   Adapters/git-hooks/commit-msg          (42-name bash array)
#   Adapters/github-actions/pr-validation.yml  (the same array, again)
#   .github/workflows/pr-validation.yml    (the same array, a third time)
#   VERSION.md                             (count + named list per category)
#   Core/CAPABILITY_TIERS.md               (Default Tier assignment table)
#   Core/EMPLOYEE_SELECTION.md             (one dispatch trigger per Employee)
#
# Adapters/README.md listed "a single shared Employee-roster source file" as a
# deliberately-deferred improvement from v0.0.9 onward. This is that file.
# Everything mechanical now reads it; Adapters/scripts/validate-framework.sh
# fails the build when any of the six locations above drifts from it.
#
# WHAT THIS FILE OWNS — the identity facts that were duplicated:
#   name      the exact Employee name, as it must appear in an `Employee:`
#             commit trailer (Standards/COMMIT_STANDARD.md,
#             Core/MAIN_AGENT_CONDUCT.md "Dispatch Discipline")
#   file      the Employee definition, which remains the authoritative source
#             for Mission, Responsibilities, Authority, and Escalation Rules
#   category  the Employees/ subdirectory it lives in
#   tier      Default Complexity Tier, per Core/CAPABILITY_TIERS.md
#
# WHAT THIS FILE DELIBERATELY DOES NOT OWN — anything that would create a new
# duplication. Dispatch triggers stay in Core/EMPLOYEE_SELECTION.md; Mission,
# Authority, and Escalation Rules stay in the Employee definition. The
# validator checks that every Employee here has a trigger there, rather than
# copying the trigger text into this file.
#
# PARSING CONTRACT — read this before reformatting.
# Git hooks run on developer machines with no guaranteed YAML parser, so the
# `name:` lines are consumed with plain grep/sed:
#     grep -E '^  - name: ' Registry/employees.yml | sed 's/^  - name: //'
# Every entry must therefore keep `  - name: <Name>` as its FIRST line, with
# exactly two leading spaces, no quotes, and no trailing comment. The
# validator enforces this shape so the contract cannot silently break.

employees:
