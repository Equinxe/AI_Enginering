name: IA Engineering - CI Build & Test

# Parametric CI for a project bootstrapped from IA Engineering
# (Workflows/PROJECT_BOOTSTRAP.md). One project, one stack: rather than a
# separate workflow per language, this file runs a single job that first
# RESOLVES the project's stack, then executes only the build/test steps that
# match. Every language step is guarded by an `if:` on that output, so exactly
# one path runs per project.
#
# Mechanism (chosen for clarity over a build matrix — a bootstrapped project
# has exactly one stack, so a matrix would only ever populate one cell):
#   1. A `Resolve project stack` step calls
#      Adapters/scripts/resolve-stack.sh and writes a single `stack` output.
#   2. Each language block below runs only when `steps.detect.outputs.stack`
#      equals its stack.
#
# THE RESOLUTION LIVES IN A SCRIPT, not in this file, for the same reason the
# PR checks do: logic inside a workflow can only be tested by deploying it.
# Its cases are in Adapters/scripts/tests/run.sh.
#
# A DECLARATION BEATS A GUESS. setup-project-bootstrap.sh writes the stack it
# was told to install into `.ia-engineering/stack`, and that file wins. It is
# committed, like the project roster beside it — a declaration CI cannot read
# declares nothing. A declaration naming an unknown stack FAILS rather than
# falling back to sniffing, because a typo that silently switched builds would
# report success for a stack nobody chose.
#
# The stacks this file builds, one step block each: node, web, python, go,
# jvm, dotnet, php, and generic (the placeholder fallback). They are
# KNOWN_STACKS in resolve-stack.sh.
#
# Manifest detection remains, and applies only when there is no declaration.
# Every manifest is checked; there is no precedence order:
#   package.json                              -> node
#   composer.json                             -> php
#   go.mod                                    -> go
#   pyproject.toml OR requirements.txt        -> python
#   pom.xml OR build.gradle(.kts)             -> jvm
#   *.csproj OR *.fsproj OR *.sln             -> dotnet
# Exactly one match is the stack. No match is `generic`. More than one match
# FAILS the step and asks the project to declare its stack, because a Laravel
# application has composer.json AND package.json and both are true. `web` is
# never inferred: it exists only as a declaration.
#
# Inference is the weaker mechanism and is bounded by design: one manifest can
# belong to more than one stack — a React site and a Node server both have
# package.json — so no rule over file names can separate them. That is why the
# declaration exists, and why new stacks became possible once it did.
#
# The Generic fallback does NOT fail the build silently — it emits a warning
# and leaves a clearly marked placeholder for the adopting project to fill in
# its own build/test commands.
#
# Install in a bootstrapped project (see Adapters/scripts/setup-project-bootstrap.sh):
#   mkdir -p .github/workflows
#   cp ia-engineering/Adapters/github-actions/ci-build-test.yml .github/workflows/
#
# Scoped to PRs targeting main or develop only, matching pr-validation.yml and
# the Git Standard's protected-branch gate.

on:
  pull_request:
    branches: [main, develop]
    types: [opened, edited, synchronize, reopened]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve project stack
        id: detect
        run: |
          set -euo pipefail
          # The resolution lives in Adapters/scripts/resolve-stack.sh so it can
          # be tested without deploying it. This step only wires it up.
          for candidate in . ia-engineering; do
            if [ -x "$candidate/Adapters/scripts/resolve-stack.sh" ]; then
              stack="$("$candidate/Adapters/scripts/resolve-stack.sh" .)"
              echo "stack=$stack" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::Could not locate Adapters/scripts/resolve-stack.sh (looked in . and ia-engineering/). If the framework is imported at another path, adjust this step."
          exit 1

      # --- Node -------------------------------------------------------------
      - name: Set up Node.js
        if: steps.detect.outputs.stack == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Node build & test
        if: steps.detect.outputs.stack == 'node'
        run: |
          # Prefer a clean, reproducible install when a lockfile is present.
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          # Build only if the project defines a build script.
          npm run build --if-present
          npm test

      # --- Python -----------------------------------------------------------
      - name: Set up Python
        if: steps.detect.outputs.stack == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Python build & test
        if: steps.detect.outputs.stack == 'python'
        run: |
          python -m pip install --upgrade pip
          # Install dependencies from whichever manifest the project ships.
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f pyproject.toml ]; then
            pip install .
          fi
          # pytest is the assumed test runner; adjust if your project differs.
          python -m pytest

      # --- Go ---------------------------------------------------------------
      - name: Set up Go
        if: steps.detect.outputs.stack == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Go build & test
        if: steps.detect.outputs.stack == 'go'
        run: |
          go build ./...
          go test ./...

      # --- JVM (Maven or Gradle) -------------------------------------------
      - name: Set up JDK
        if: steps.detect.outputs.stack == 'jvm'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: JVM build & test
        if: steps.detect.outputs.stack == 'jvm'
        run: |
          # Maven takes precedence when a pom.xml exists; otherwise use Gradle,
          # preferring the project's wrapper (./gradlew) when it is present.
          if [ -f pom.xml ]; then
            mvn -B verify
          elif [ -x ./gradlew ]; then
            ./gradlew build
          else
            gradle build
          fi

      # --- Web (static front end) -------------------------------------------
      #
      # Builds with Node like the `node` stack, and that is where the
      # similarity ends: what ships is a directory of files, not a process.
      # This stack cannot be inferred — see Adapters/scripts/resolve-stack.sh —
      # so reaching here means the project declared it.
      - name: Set up Node.js (web)
        if: steps.detect.outputs.stack == 'web'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Web build & test
        if: steps.detect.outputs.stack == 'web'
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          # The build is NOT optional for this stack, unlike `node`. A static
          # front end whose build produced nothing has nothing to deploy, and
          # `--if-present` would let a missing build script pass as success.
          npm run build
          # Tests are optional and stay optional: a young front end often has
          # none, and failing the build for that would push projects to delete
          # the check rather than add tests.
          npm test --if-present

      # --- .NET ---------------------------------------------------------------
      - name: Set up .NET
        if: steps.detect.outputs.stack == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: .NET build & test
        if: steps.detect.outputs.stack == 'dotnet'
        run: |
          set -euo pipefail
          dotnet restore
          dotnet build --configuration Release --no-restore
          # --no-build so the test run uses the binaries just built rather
          # than rebuilding with different settings, which would mean testing
          # something other than what was built.
          dotnet test --configuration Release --no-build --verbosity normal

      # --- PHP ----------------------------------------------------------------
      - name: Set up PHP
        if: steps.detect.outputs.stack == 'php'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP build & test
        if: steps.detect.outputs.stack == 'php'
        run: |
          set -euo pipefail
          # --no-progress keeps the log readable; --prefer-dist is faster and
          # is what a CI install wants. Dev dependencies ARE installed here,
          # unlike in the Dockerfile: the test tooling lives among them.
          composer install --no-interaction --no-progress --prefer-dist
          # Composer projects declare their test command; there is no single
          # convention. A project with neither a `test` script nor PHPUnit is
          # told so rather than passing quietly.
          if composer run-script --list 2>/dev/null | grep -qE '^[[:space:]]+test'; then
            composer run-script test
          elif [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit
          else
            echo "::warning::No 'test' script in composer.json and no vendor/bin/phpunit. Nothing was tested. Add a test script so this check means something."
          fi

      # --- Generic fallback -------------------------------------------------
      - name: Generic build & test (placeholder)
        if: steps.detect.outputs.stack == 'generic'
        run: |
          echo "No first-class stack (Node, web, Python, Go, JVM, .NET, PHP) was declared or detected."
          # TODO(adopting project): replace the lines below with your project's
          # real build and test commands, e.g.:
          #   make build
          #   make test
          echo "::warning::Generic fallback in use — edit ci-build-test.yml to add your project's build and test commands."
