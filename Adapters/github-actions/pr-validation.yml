name: IA Engineering - PR Validation

# Seven checks, each mechanically enforcing something the framework already
# documents instead of relying on a human or AI reviewer to remember it:
#   - pr-compliance: every PR must trace to a Work Unit and have a real,
#     filled-in description (Templates/WORK_UNIT.md, Templates/PULL_REQUEST.md)
#   - work-unit-exists: each commit's `Work Unit:` trailer resolves against
#     Registry/work-units.yml, rather than a format regex matching a string in
#     the PR description — closing the gap Adapters/README.md listed under
#     Planned since v0.0.9. Reads trailers, not prose: see the job for why
#     both prose-based versions were wrong
#   - employee-trailer: every non-merge commit in the PR carries a valid
#     `Employee: <Name>` trailer, validated against Registry/employees.yml —
#     a server-side backstop for Adapters/git-hooks/commit-msg, which is
#     bypassable with --no-verify or by never installing the hook
#     (Core/MAIN_AGENT_CONDUCT.md, Dispatch Discipline)
#   - shellcheck-adapters: the git hooks and scripts we ship must actually be
#     valid, warning-free shell (Standards/CODE_QUALITY_STANDARD.md applies to
#     Adapters code exactly as it does to any other code)
#   - yaml-lint: every workflow file we ship must at minimum parse as valid YAML
#   - pr-size: the PR changes at most 1,500 lines outside files marked
#     `linguist-generated` in .gitattributes (Standards/PULL_REQUEST_STANDARD.md,
#     Reviewability). Beyond that a PR is not reviewed, it is skimmed. The
#     Director overrides by applying the `size/approved` label — a label, not
#     body text, because applying one requires write permission on the
#     repository and pasting a sentence does not
#   - review-recorded: ADVISORY — surfaces whether a Code Reviewer decision was
#     actually recorded on the PR (Workflows/CODE_REVIEW.md). It goes RED when
#     none is found, but is not in required_status_checks.contexts, so it does
#     not block the merge. Advisory here means "red does not block", not "green
#     means nothing" — see the job for why exiting 0 either way made it
#     indistinguishable from a passing gate.
#
# Install in a project that has imported IA Engineering as a submodule:
#   ./ia-engineering/Adapters/scripts/install.sh
#
# Then add "PR Compliance", "Work Unit Exists", "Employee Trailer", "Shellcheck
# Adapters", "Validate Workflow YAML", "PR Size", "Framework Validation" (from
# framework-validation.yml) and "Data Policy" (from data-policy.yml) as
# required status checks in branch protection.
# Adapters/scripts/setup-branch-protection.sh already sets all eight.
#
# "Review Recorded (advisory)" is deliberately NOT required: it matches comment
# text, which can be satisfied by pasting the block, so requiring it would buy
# false confidence. Promoting it stays a Director decision (see the job).
#
# Scoped to PRs targeting a protected branch — main, develop, or release/*
# (see `branches:` below). This workflow enforces the Git Standard's
# protected-branch gate, not every branch.
#
# release/* was added in WU-IAENG-144. Until then this workflow did not trigger
# for a PR targeting a release branch at all, which made required status checks
# impossible there: GitHub blocks a merge forever on a check that can never be
# reported. setup-branch-protection.sh had to leave release/* with no required
# checks and flagged widening this trigger as a follow-up. Workflows/RELEASE.md
# Step 4 sends every release-branch defect fix through a PR, so those were the
# only PRs in the process running with no validation at all.

on:
  pull_request:
    branches: [main, develop, 'release/**']
    # labeled/unlabeled: the PR Size check's Director override is a label, so
    # applying or removing it must re-run the check.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

jobs:
  pr-compliance:
    name: PR Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Check for a Work Unit reference
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          COMBINED="${PR_TITLE}
          ${PR_BODY}"

          if echo "$COMBINED" | grep -qE 'WU-[A-Za-z0-9]+-[0-9]+'; then
            echo "Work Unit reference found."
          else
            echo "::error::No Work Unit reference (format: WU-[project]-[number]) found in the PR title or description. Per Templates/WORK_UNIT.md, every Pull Request must trace to a Work Unit."
            exit 1
          fi

      - name: Check the PR description is not empty or unfilled
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "${PR_BODY// /}" ]; then
            echo "::error::PR description is empty. Per Templates/PULL_REQUEST.md, every PR must use the Pull Request template with 'What changed', 'Why', and 'How to test' filled in."
            exit 1
          fi

          if echo "$PR_BODY" | grep -qE '\[Describe what this PR does|\[Link to the Work Unit|\[Step-by-step instructions'; then
            echo "::error::PR description still contains unfilled template placeholders. Complete the Pull Request template before requesting review."
            exit 1
          fi

          echo "PR description present and filled in."

  work-unit-exists:
    name: Work Unit Exists
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the base..head commit range is available, matching
          # the employee-trailer job — this check reads the same commits.
          fetch-depth: 0
          # A consumer project keeps its Work Unit registry inside the imported
          # framework directory.
          submodules: recursive
      - name: Resolve each commit's Work Unit trailer against the registry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # PR Compliance checks that a Work Unit ID is PRESENT in the PR text.
          # This job checks that the PR's OWN Work Unit RESOLVES.
          # `WU-XXXXX-99999` satisfies a format regex, and so does a typo in a
          # real ID or an ID for a Work Unit that was never defined.
          # Templates/WORK_UNIT.md requires every Pull Request to trace to a
          # Work Unit, and a format check establishes the appearance of
          # traceability rather than traceability. This closes the gap
          # Adapters/README.md listed under Planned since v0.0.9.
          #
          # IT READS COMMIT TRAILERS, NOT THE PR DESCRIPTION. Two earlier
          # versions read the prose and both were wrong, in opposite
          # directions:
          #
          #   Requiring every WU- id in the title and body to resolve failed on
          #   any PR citing a Work Unit older than the registry's start — and
          #   this project's descriptions cite earlier Work Units constantly.
          #   A PR saying "this corrects WU-IAENG-125" was blocked for
          #   describing its own motivation accurately.
          #
          #   Requiring only ONE of them to resolve fixed that and reintroduced
          #   the original hole. In "Implements WU-IAENG-160, following on from
          #   WU-IAENG-137", the historical id resolves and the PR's actual
          #   Work Unit — the one that matters, and the one most likely to be
          #   mistyped or unregistered — goes unchecked. Since nearly every
          #   description cites some prior Work Unit, the resolving id would
          #   almost always be the historical one. That collapses back to
          #   "some WU-shaped string is present", which PR Compliance already
          #   covers.
          #
          # Prose citations are unbounded and retroactive; a commit trailer is
          # singular and structural. It is also the same evidence source
          # employee-trailer uses, so the Work Unit claim and the Employee
          # claim now have identical provenance, and neither can be altered by
          # rewording the description after review.
          #
          # NOTE ON PARSING: these commits put `Work Unit:` and `Employee:` in
          # separate paragraphs, so git's own trailer parser sees only the last
          # block — `git log --format='%(trailers:key=Work Unit,valueonly)'`
          # returns empty for every commit on this branch (verified). The
          # anchored grep below is required, exactly as employee-trailer does
          # for its own trailer.

          REGISTRY=""
          for candidate in \
            "${IAENG_REGISTRY_WORK_UNITS:-}" \
            "Registry/work-units.yml" \
            "ia-engineering/Registry/work-units.yml"
          do
            if [ -n "$candidate" ] && [ -f "$candidate" ]; then
              REGISTRY="$candidate"
              break
            fi
          done

          if [ -z "$REGISTRY" ]; then
            echo "::error::Could not locate Registry/work-units.yml. A project that has not adopted the Work Unit registry should remove this job rather than have it pass without checking anything."
            exit 1
          fi

          echo "Registry: $REGISTRY"

          KNOWN="$(grep -E '^  - id: ' "$REGISTRY" | sed 's/^  - id: //' | tr -d '\r')"
          echo "Registered Work Units: $(echo "$KNOWN" | grep -c . || true)"

          COMMITS="$(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")"

          if [ -z "$COMMITS" ]; then
            echo "No non-merge commits to check."
            exit 0
          fi

          # PER COMMIT, mirroring the employee-trailer loop below.
          #
          # An earlier version collected every trailer with `sort -u` and then
          # asked only whether the collection was non-empty. A commit carrying
          # no `Work Unit:` trailer was therefore invisible as long as any
          # sibling commit had one — the per-PR test could not see a per-commit
          # omission. CLAUDE.md's rule is "One Work Unit -> One Commit -> One
          # engineering objective", so enforcing it per-PR was the asymmetry
          # the wrong way round, especially beside employee-trailer which
          # already reports each commit individually.
          #
          # The anchor on the grep is load-bearing twice over: it keeps a
          # mid-sentence mention of an ID from being read as a claim — this
          # job's own WU-XXXXX-99999 example does appear in a commit body on
          # this branch — and `head -1` keeps a body that quotes a trailer
          # from overriding the real one.
          fail=0
          for sha in $COMMITS; do
            # EVERY `Work Unit: ` line in the message, not one chosen by
            # position. Picking one by ordinal is bypassable from whichever end
            # is not chosen — a squash-concatenated message carries one trailer
            # block per squashed part, so `head -1` and `tail -1` each leave the
            # other blocks unchecked. See Adapters/git-hooks/commit-msg for the
            # reproduced cases. This job's own WU-XXXXX-99999 example appears in
            # a commit body on this branch, which is why the pattern stays
            # anchored to column 0.
            WU_LINES="$(git log -1 --format=%B "$sha" | grep -E '^Work Unit: ' || true)"

            if [ -z "$WU_LINES" ]; then
              echo "::error::Commit $sha carries no 'Work Unit: <WU-ID>' trailer. Per CLAUDE.md one Work Unit is one commit, and per Templates/WORK_UNIT.md every change must trace to a Work Unit. A Work Unit ID in the PR description does not substitute: a description can be reworded after review, a trailer cannot."
              fail=1
              continue
            fi

            # At most one claim, mirroring Adapters/git-hooks/commit-msg Rule 3.
            # One Work Unit is one commit, so a second `Work Unit:` line is
            # malformed rather than ambiguous — and refusing it is what allows
            # release.sh to attribute a Work Unit to a commit with no ordinal.
            # Ranking by position produced a false PASS on the release gate: a
            # deferral note quoted after the trailer block counted as merged.
            WU_COUNT="$(printf '%s\n' "$WU_LINES" | grep -c . || true)"
            if [ "$WU_COUNT" -gt 1 ]; then
              echo "::error::Commit $sha carries $WU_COUNT 'Work Unit:' lines at column 0. One Work Unit is one commit (Standards/COMMIT_STANDARD.md), and downstream readers rely on there being exactly one. If one is an EXAMPLE quoted in the body — a deferral note, a reference to earlier work — indent it so it does not start at column 0."
              fail=1
              continue
            fi

            while IFS= read -r wu_line; do
              [ -n "$wu_line" ] || continue
              WU="$(echo "${wu_line#Work Unit: }" | tr -d '\r')"
              if echo "$KNOWN" | grep -qxF "$WU"; then
                echo "  $sha -> $WU (resolved)"
              else
                echo "::error::Commit $sha claims '$WU', which is not in $REGISTRY. Either it is a typo, or the Work Unit was never registered. Register it in the same commit that performs the work — see the registry's own header for the field shape. If this line is an EXAMPLE quoted in the message body, indent it so it does not start at column 0."
                fail=1
              fi
            done < <(printf '%s\n' "$WU_LINES")
          done

          exit "$fail"

  employee-trailer:
    name: Employee Trailer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the base..head commit range is available server-side.
          fetch-depth: 0
          # A consumer project imports the framework as a submodule, so the
          # roster this job reads lives at ia-engineering/Registry/employees.yml
          # and is absent unless submodules are checked out.
          submodules: recursive
      - name: Re-validate the Employee trailer on every commit in the PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Server-side backstop for Adapters/git-hooks/commit-msg, Rule 2
          # (Dispatch Discipline). The local commit-msg hook enforces the
          # `Employee: <Name>` trailer, but it is bypassable with `git commit
          # --no-verify` or by simply never running the install step (git does
          # not transmit hooks). This job re-checks every NON-MERGE commit in the
          # PR carries a valid trailer, using the same trailer key and the same
          # roster as the hook — so a commit that skipped the hook is still
          # caught here, before merge.
          #
          # Both this job and the hook now read Registry/employees.yml (see
          # Registry/README.md). Until WU-IAENG-138 they each carried their own
          # hardcoded 42-name bash array, kept in sync by hand; that duplication
          # is gone, so the hook and this backstop can no longer disagree about
          # who is on the roster.
          set -euo pipefail

          # Same resolution order as the hook: explicit override, then the
          # framework's own repository, then the submodule path.
          ROSTER=""
          for candidate in \
            "${IAENG_REGISTRY:-}" \
            "Registry/employees.yml" \
            "ia-engineering/Registry/employees.yml"
          do
            if [ -n "$candidate" ] && [ -f "$candidate" ]; then
              ROSTER="$candidate"
              break
            fi
          done

          if [ -z "$ROSTER" ]; then
            echo "::error::Could not locate Registry/employees.yml (looked at \$IAENG_REGISTRY, Registry/, ia-engineering/Registry/). The Employee roster is the single source of truth for this check; failing closed rather than passing without validating anything."
            exit 1
          fi

          echo "Roster: $ROSTER"

          # Parsing contract per Registry/README.md. `tr -d '\r'` guards against
          # a CRLF checkout leaving a carriage return on every name.
          VALID_NAMES="$(grep -E '^  - name: ' "$ROSTER" | sed 's/^  - name: //' | tr -d '\r')"
          echo "Roster entries: $(echo "$VALID_NAMES" | wc -l)"

          # Project roster extension — Domain Employees defined by the project
          # (Templates/DOMAIN_EMPLOYEE.md), same parsing contract, same
          # resolution as the hook: an explicit IAENG_PROJECT_ROSTER that names
          # a missing file is refused, the default location is optional.
          PROJECT_ROSTER=""
          if [ -n "${IAENG_PROJECT_ROSTER:-}" ]; then
            if [ -f "$IAENG_PROJECT_ROSTER" ]; then
              PROJECT_ROSTER="$IAENG_PROJECT_ROSTER"
            else
              echo "::error::IAENG_PROJECT_ROSTER is set to '$IAENG_PROJECT_ROSTER' but no such file exists. Validating against the framework roster alone would silently refuse every Domain Employee; fix the path or unset the variable."
              exit 1
            fi
          elif [ -f ".ia-engineering/Registry/employees.yml" ]; then
            PROJECT_ROSTER=".ia-engineering/Registry/employees.yml"
          fi
          if [ -n "$PROJECT_ROSTER" ]; then
            PROJECT_NAMES="$(grep -E '^  - name: ' "$PROJECT_ROSTER" | sed 's/^  - name: //' | tr -d '\r')"
            echo "Project roster: $PROJECT_ROSTER ($(echo "$PROJECT_NAMES" | grep -c .) Domain Employee(s))"
            VALID_NAMES="$(printf '%s\n%s\n' "$VALID_NAMES" "$PROJECT_NAMES")"
          else
            echo "Project roster: none (.ia-engineering/Registry/employees.yml absent — no Domain Employees)"
          fi

          # Merge commits are excluded via --no-merges, mirroring the hook's
          # MERGE_HEAD exception: an auto-generated merge subject ("Merge branch
          # ...", "Merge pull request #N ...") can never carry an Employee
          # trailer and must not be rejected.
          COMMITS="$(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")"

          if [ -z "$COMMITS" ]; then
            echo "No non-merge commits to validate in this PR."
            exit 0
          fi

          fail=0
          for sha in $COMMITS; do
            MSG="$(git log -1 --format=%B "$sha")"
            # EVERY `Employee: ` line, matching Adapters/git-hooks/commit-msg
            # exactly. Choosing one line by position was bypassable from
            # whichever end was not chosen: with `head -1`, a body quoting a
            # valid name early masked a real trailer naming a tool label; with
            # `tail -1`, a squash-concatenated message whose first block carried
            # `Employee: executor` and whose last block carried a valid name was
            # accepted. Both reproduced. Validating all of them makes the
            # ordinal irrelevant.
            EMPLOYEE_LINES="$(echo "$MSG" | grep -E '^Employee: ' || true)"

            if [ -z "$EMPLOYEE_LINES" ]; then
              echo "::error::Commit $sha is missing an 'Employee: <Name>' trailer. Per Core/MAIN_AGENT_CONDUCT.md (Dispatch Discipline), every commit must identify the Employee who produced it. This commit likely skipped the local commit-msg hook (--no-verify or uninstalled hook)."
              fail=1
              continue
            fi

            while IFS= read -r emp_line; do
              [ -n "$emp_line" ] || continue
              EMPLOYEE_NAME="$(echo "${emp_line#Employee: }" | tr -d '\r')"
              if ! echo "$VALID_NAMES" | grep -qxF "$EMPLOYEE_NAME"; then
                echo "::error::Commit $sha has 'Employee: $EMPLOYEE_NAME', which is not in $ROSTER${PROJECT_ROSTER:+ nor in the project roster $PROJECT_ROSTER}. A functional or tool label ('executor', 'coder', 'reviewer-bot', etc.) is not a valid Employee name — see Core/MAIN_AGENT_CONDUCT.md, 'Naming matters.' If this line is an EXAMPLE quoted in the message body, indent it so it does not start at column 0."
                fail=1
              fi
            done < <(printf '%s\n' "$EMPLOYEE_LINES")
          done

          exit "$fail"

  shellcheck-adapters:
    name: Shellcheck Adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck on git hooks and scripts
        run: |
          # shellcheck is preinstalled on GitHub-hosted ubuntu-latest runners —
          # no third-party action, no extra install step.
          shellcheck Adapters/git-hooks/* Adapters/scripts/*.sh Adapters/ai-runtimes/*.sh

  yaml-lint:
    name: Validate Workflow YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML syntax
        run: |
          fail=0
          for f in Adapters/github-actions/*.yml .github/workflows/*.yml; do
            [ -f "$f" ] || continue
            if npx --yes -q js-yaml "$f" > /dev/null 2>&1; then
              echo "OK: $f"
            else
              echo "::error::Invalid YAML syntax in $f"
              fail=1
            fi
          done
          exit "$fail"

  review-recorded:
    name: Review Recorded (advisory)
    runs-on: ubuntu-latest
    permissions:
      # Reading PR conversation comments (/issues/{n}/comments) needs issues:read;
      # reading PR reviews (/pulls/{n}/reviews) needs pull-requests:read.
      issues: read
      pull-requests: read
    steps:
      - name: Check a Code Reviewer decision was recorded on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # ADVISORY / WARNING-ONLY backstop for Workflows/CODE_REVIEW.md.
          #
          # Why this check cannot use GitHub's native review-approval count:
          # setup-branch-protection.sh sets required_approving_review_count: 0 by
          # design — all Employees and the Director share ONE `gh` identity, so
          # GitHub-native "approve" would be self-approval and is structurally
          # impossible (a documented hard constraint, not a preference). So
          # "was this PR reviewed?" cannot be answered by GitHub's approval gate.
          #
          # Why comment-pattern over a label (the two candidate approaches):
          # A label (e.g. `reviewed`) is a single click any actor can apply with
          # no evidence a review happened — weak, easily rubber-stamped. Instead
          # we look for the Code Reviewer's ACTUAL output: the "Review Decision"
          # block defined in Employees/Specialized/CODE_REVIEWER.md, whose filled
          # form contains a line `Decision: approved`. Requiring that block to be
          # present ties the check to real reviewer output (the evidence-over-
          # ceremony principle in Adapters/README.md), and the pattern is written
          # to reject the UNFILLED template line `Decision: [approved / ...]`
          # (note the `[`), so pasting the empty template does not satisfy it.
          #
          # Why ADVISORY (exit 0, ::warning:: only), not a hard-blocking check:
          # comment-text matching is inherently softer evidence than a native
          # gate and could be gamed by pasting the block, so shipping it as a
          # required status check now would risk false confidence. It is emitted
          # as a warning so it is visible on every PR without blocking merge.
          # WHY IT GOES RED WHEN NO DECISION IS FOUND, YET IS STILL NOT
          # REQUIRED. Two objections were raised against this job and both are
          # correct, but they attack different properties:
          #
          #   Against requiring it: the evidence is comment text, satisfiable
          #   by pasting the block. Unfixable at this evidence level.
          #
          #   Against keeping it: an advisory job that emits a warning and
          #   exits 0 renders GREEN whether or not a decision was found. It
          #   occupies the place a reader looks for that assurance and answers
          #   "yes" unconditionally, with the warning one click away in a log.
          #
          # The second objection is about the SIGNAL, not about blocking, so it
          # is fixed by exiting non-zero — not by promotion. Red here is
          # truthful and costs nothing procedurally, because "Review Recorded
          # (advisory)" is deliberately absent from
          # required_status_checks.contexts in setup-branch-protection.sh: the
          # merge button stays enabled. The "(advisory)" suffix therefore
          # changes meaning from "green here means nothing" to "red here does
          # not block".
          #
          # Green-when-absent is the same defect as pass-when-unevaluated, and
          # this milestone corrected eleven instances of it. Shipping the
          # twelfth in the check whose subject is whether the review happened
          # would be the worst possible place for it.
          #
          # TWO LIMITATIONS, recorded so nobody promotes this later believing
          # they were weighed:
          #
          #   1. Comments are not durable evidence. A comment can be edited or
          #      deleted after this check runs and after merge, so even as a
          #      retrospective record the artifact does not survive. That is a
          #      stronger argument against promotion than the pasting one, and
          #      it names the successor: commit the filled Review Decision
          #      block as a file referenced by the Work Unit. The check then
          #      becomes "this file exists and parses" — content under version
          #      control, diffable, immutable once merged — and it CAN be
          #      required, because the single-identity constraint stops
          #      mattering once the evidence is content rather than an
          #      approval action. Advisory is a stage, not a verdict.
          #
          #   2. This check never examines the comment's author. It reads every
          #      body from every actor, so a PR author satisfies it themselves.
          #      Under the shared-`gh`-identity constraint that is unavoidable
          #      today, but the blindness is inherent to the substitute and
          #      would persist in a project with separate accounts. The note
          #      above explains why NATIVE approval is unavailable; this says
          #      the substitute inherits the same gap.
          #
          # Promoting it to a required check remains a Director decision, and
          # the two limitations above are the case against doing so until the
          # successor in (1) exists.

          ISSUE_COMMENTS="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate -q '.[].body' || true)"
          REVIEW_BODIES="$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate -q '.[].body' || true)"
          ALL_BODIES="$(printf '%s\n%s\n' "$ISSUE_COMMENTS" "$REVIEW_BODIES")"

          # Match a filled decision line: `Decision: approved` (case-insensitive,
          # optional leading indentation). The `approved` must follow the colon
          # directly (after optional spaces), so the unfilled template line
          # `Decision: [approved / changes requested / escalated]` — where a `[`
          # follows the colon — does NOT match.
          if echo "$ALL_BODIES" | grep -qiE '^[[:space:]]*Decision:[[:space:]]*approved'; then
            echo "A recorded Code Reviewer decision ('Decision: approved') was found on this PR."
            exit 0
          fi

          echo "::error::No recorded Code Reviewer decision ('Decision: approved', per Employees/Specialized/CODE_REVIEWER.md's Review Decision block) was found in this PR's comments or reviews. Per Workflows/CODE_REVIEW.md a Code Reviewer decision must be recorded before merge."
          echo "::notice::This check is ADVISORY: it is not in required_status_checks.contexts, so it does not block the merge. It goes red rather than green so its result is legible — an advisory check that exits 0 either way is indistinguishable from a passing gate."
          exit 1

  pr-size:
    name: PR Size
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so base..head is diffable server-side, and the head
          # checkout's .gitattributes is what `git check-attr` reads.
          fetch-depth: 0
      - name: Count changed lines outside generated files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          LIMIT: "1500"
        run: |
          # Standards/PULL_REQUEST_STANDARD.md, Reviewability. A review is a
          # reading; past a certain size it becomes a skim that approves what it
          # did not read, and the approval is then worth less than no approval,
          # because it is trusted. The limit is on lines a reviewer must READ:
          # additions plus deletions, excluding
          #   - files marked `linguist-generated` in .gitattributes, which is
          #     the hosting platform's own convention for "collapsed in the diff
          #     view because no human reads it" — lockfiles, snapshots, built
          #     assets, generated clients. Declared in a committed file, so the
          #     exclusion list is itself reviewed;
          #   - binary files, which have no line count.
          #
          # The override is a LABEL, `size/approved`, not a sentence in the PR
          # body. Applying a label requires write permission; pasting a sentence
          # requires nothing. Review Recorded is advisory for exactly the second
          # reason, and this check would be too if its override were text.
          set -euo pipefail

          TOTAL=0; FILES=0; GENERATED=0; BINARY=0
          while IFS=$'\t' read -r added deleted path; do
            [ -n "$path" ] || continue
            FILES=$((FILES + 1))
            if [ "$added" = "-" ]; then
              BINARY=$((BINARY + 1)); continue
            fi
            attr="$(git check-attr linguist-generated -- "$path" | sed 's/.*: //')"
            if [ "$attr" = "set" ] || [ "$attr" = "true" ]; then
              GENERATED=$((GENERATED + 1)); continue
            fi
            TOTAL=$((TOTAL + added + deleted))
          done < <(git diff --numstat "$BASE_SHA" "$HEAD_SHA")

          echo "Files changed: $FILES ($GENERATED generated, $BINARY binary — excluded)"
          echo "Lines to review: $TOTAL (limit $LIMIT)"

          if [ "$TOTAL" -le "$LIMIT" ]; then
            echo "Within the review limit."
            exit 0
          fi

          if printf '%s\n' "$LABELS" | tr ',' '\n' | grep -qxF 'size/approved'; then
            echo "::notice::$TOTAL lines exceed the $LIMIT-line review limit, and the Director has applied 'size/approved'. Passing on that decision — it is recorded on the PR by the label's audit trail."
            exit 0
          fi

          echo "::error::This PR changes $TOTAL lines outside generated files; the review limit is $LIMIT (Standards/PULL_REQUEST_STANDARD.md, Reviewability). Split it into Work Units that can each be read, or — if the size is genuinely irreducible — the Director applies the 'size/approved' label. Files that no human reads (lockfiles, snapshots, built output) are excluded when marked 'linguist-generated' in .gitattributes."
          exit 1
