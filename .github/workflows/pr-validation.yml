name: IA Engineering - PR Validation

# Eight checks, each mechanically enforcing something the framework already
# documents instead of relying on a human or AI reviewer to remember it:
#   - pr-compliance: every PR must trace to a Work Unit and have a real,
#     filled-in description (Templates/WORK_UNIT.md, Templates/PULL_REQUEST.md)
# THE FOUR CHECKS BELOW ARE THIN WRAPPERS. Their logic lives in
# Adapters/scripts/check-*.sh and is exercised by Adapters/scripts/tests/run.sh,
# which the `script-tests` job runs. It used to live here, as 262 lines of
# shell inside this file, and that had three costs: it ran on GitHub and
# nowhere else; an adopting project could not run it before pushing; and it
# could only be tested by deploying it. The third is not theoretical — it is
# how `pr-size` came to refuse every Pull Request with an empty diff, which
# deadlocked the v0.0.12 release against Workflows/RELEASE.md Step 8, and
# diagnosing it needed a separate program to lift the run: block out of this
# file so it could be executed at all.
#
#   - work-unit-exists: each commit's `Work Unit:` trailer resolves against
#     Registry/work-units.yml, rather than a format regex matching a string in
#     the PR description — closing the gap Adapters/README.md listed under
#     Planned since v0.0.9. Reads trailers, not prose: see the job for why
#     both prose-based versions were wrong
#   - employee-trailer: every non-merge commit in the PR carries a valid
#     `Employee: <Name>` trailer, validated against Registry/employees.yml —
#     a server-side backstop for Adapters/git-hooks/commit-msg, which is
#     bypassable with --no-verify or by never installing the hook
#     (Core/MAIN_AGENT_CONDUCT.md, Dispatch Discipline)
#   - shellcheck-adapters: the git hooks and scripts we ship must actually be
#     valid, warning-free shell (Standards/CODE_QUALITY_STANDARD.md applies to
#     Adapters code exactly as it does to any other code)
#   - yaml-lint: every YAML file we ship — workflows and the issue-template
#     config alike — must at minimum parse. The file list is derived from
#     git ls-files, not from two hard-coded directories, which is what used to
#     leave ai-runtimes/claude-code/review-bot.yml unchecked while the claim
#     said otherwise
#   - hook-tests: the runtime hooks in Adapters/ai-runtimes/claude-code/hooks/
#     still refuse what Standards/GIT_STANDARD.md forbids and still permit what
#     it does not. Their correctness is behaviour, not structure, so neither
#     shellcheck nor the validator can see it
#   - pr-size: the PR changes at most 1,500 lines outside files marked
#     `linguist-generated` in .gitattributes (Standards/PULL_REQUEST_STANDARD.md,
#     Reviewability). Beyond that a PR is not reviewed, it is skimmed. The
#     Director overrides by applying the `size/approved` label — a label, not
#     body text, because applying one requires write permission on the
#     repository and pasting a sentence does not
#   - review-recorded: ADVISORY — surfaces whether a Code Reviewer decision was
#     actually recorded on the PR (Workflows/CODE_REVIEW.md). It goes RED when
#     none is found, but is not in required_status_checks.contexts, so it does
#     not block the merge. Advisory here means "red does not block", not "green
#     means nothing" — see the job for why exiting 0 either way made it
#     indistinguishable from a passing gate.
#
# Install in a project that has imported IA Engineering as a submodule:
#   ./ia-engineering/Adapters/scripts/install.sh
#
# Then add "PR Compliance", "Work Unit Exists", "Employee Trailer", "Shellcheck
# Adapters", "Validate Workflow YAML", "Hook Tests", "Script Tests", "PR Size",
# "Framework Validation" (from framework-validation.yml) and "Data Policy"
# (from data-policy.yml) as required status checks in branch protection.
# Adapters/scripts/setup-branch-protection.sh already sets all ten.
#
# "Risk Map (advisory)" verifies the project's Risk Map and then reports the
# highest change zone this Pull Request touches, requiring a RISK: record when
# that zone is sensitive (Standards/RISK_STANDARD.md, The Risk Map). It is
# advisory FOR NOW for the reason every new required check here has been: one
# that has never reported blocks every merge on a status that cannot appear.
# It is also the first check that fails on a project which has not written a
# map, and that state deserves to be seen before it blocks anyone.
#
# "Review Recorded (advisory)" is deliberately NOT required: it matches comment
# text, which can be satisfied by pasting the block, so requiring it would buy
# false confidence. Promoting it stays a Director decision (see the job).
#
# Scoped to PRs targeting a protected branch — main, develop, or release/*
# (see `branches:` below). This workflow enforces the Git Standard's
# protected-branch gate, not every branch.
#
# release/* was added in WU-IAENG-144. Until then this workflow did not trigger
# for a PR targeting a release branch at all, which made required status checks
# impossible there: GitHub blocks a merge forever on a check that can never be
# reported. setup-branch-protection.sh had to leave release/* with no required
# checks and flagged widening this trigger as a follow-up. Workflows/RELEASE.md
# Step 4 sends every release-branch defect fix through a PR, so those were the
# only PRs in the process running with no validation at all.

on:
  pull_request:
    branches: [main, develop, 'release/**']
    # labeled/unlabeled: the PR Size check's Director override is a label, so
    # applying or removing it must re-run the check.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

jobs:
  pr-compliance:
    name: PR Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Check for a Work Unit reference
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          COMBINED="${PR_TITLE}
          ${PR_BODY}"

          if echo "$COMBINED" | grep -qE 'WU-[A-Za-z0-9]+-[0-9]+'; then
            echo "Work Unit reference found."
          else
            echo "::error::No Work Unit reference (format: WU-[project]-[number]) found in the PR title or description. Per Templates/WORK_UNIT.md, every Pull Request must trace to a Work Unit."
            exit 1
          fi

      - name: Check the PR description is not empty or unfilled
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "${PR_BODY// /}" ]; then
            echo "::error::PR description is empty. Per Templates/PULL_REQUEST.md, every PR must use the Pull Request template with 'What changed', 'Why', and 'How to test' filled in."
            exit 1
          fi

          if echo "$PR_BODY" | grep -qE '\[Describe what this PR does|\[Link to the Work Unit|\[Step-by-step instructions'; then
            echo "::error::PR description still contains unfilled template placeholders. Complete the Pull Request template before requesting review."
            exit 1
          fi

          echo "PR description present and filled in."

  work-unit-exists:
    name: Work Unit Exists
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Locate the framework
        id: locate
        run: |
          set -euo pipefail
          for candidate in . ia-engineering; do
            if [ -x "$candidate/Adapters/scripts/check-work-units.sh" ]; then
              echo "scripts=$candidate/Adapters/scripts" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::Could not locate Adapters/scripts/check-work-units.sh (looked in . and ia-engineering/). If the framework is imported at another path, adjust this workflow's Locate step."
          exit 1
      - name: Resolve each commit's Work Unit trailer against the registry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SCRIPTS: ${{ steps.locate.outputs.scripts }}
        run: |
          "$SCRIPTS/check-work-units.sh" "$BASE_SHA" "$HEAD_SHA"

  employee-trailer:
    name: Employee Trailer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Locate the framework
        id: locate
        run: |
          set -euo pipefail
          for candidate in . ia-engineering; do
            if [ -x "$candidate/Adapters/scripts/check-employee-trailers.sh" ]; then
              echo "scripts=$candidate/Adapters/scripts" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::Could not locate Adapters/scripts/check-employee-trailers.sh (looked in . and ia-engineering/). If the framework is imported at another path, adjust this workflow's Locate step."
          exit 1
      - name: Re-validate the Employee trailer on every commit in the PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SCRIPTS: ${{ steps.locate.outputs.scripts }}
        run: |
          "$SCRIPTS/check-employee-trailers.sh" "$BASE_SHA" "$HEAD_SHA"

  shellcheck-adapters:
    name: Shellcheck Adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck on git hooks and scripts
        run: |
          # shellcheck is preinstalled on GitHub-hosted ubuntu-latest runners —
          # no third-party action, no extra install step.
          # THE FILE LIST IS DERIVED, NOT ENUMERATED. It used to be a list of
          # globs, and every new directory needed another one: the Claude Code
          # hooks escaped it until WU-IAENG-179 widened it, and their tests
          # escaped the widened version until this. A glob list that must be
          # extended by whoever adds a directory is a check that silently
          # shrinks. `git ls-files` asks the repository instead.
          #
          # -x follows `source`, and -P SCRIPTDIR resolves each hook's
          # `# shellcheck source=lib.sh` directive relative to the hook's own
          # directory, so the shared lib.sh is checked in context rather than
          # reported as "not following" (SC1091).
          set -euo pipefail
          mapfile -t SHELL_FILES < <(
            {
              git ls-files 'Adapters/**/*.sh' 'Adapters/*.sh'
              # The git hooks are shell without a .sh extension: git requires
              # the exact names commit-msg, pre-commit, pre-push.
              git ls-files 'Adapters/git-hooks/*'
            } | sort -u
          )
          if [ "${#SHELL_FILES[@]}" -eq 0 ]; then
            echo "::error::No shell files found under Adapters/. The listing is derived from git ls-files; zero matches means the layout changed and this check would otherwise pass without examining anything."
            exit 1
          fi
          echo "Checking ${#SHELL_FILES[@]} shell files:"
          printf '  %s\n' "${SHELL_FILES[@]}"
          shellcheck -x -P SCRIPTDIR "${SHELL_FILES[@]}"

  yaml-lint:
    name: Validate Workflow YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML syntax
        run: |
          # DERIVED, like the shellcheck list. The two hard-coded directories
          # missed Adapters/ai-runtimes/claude-code/review-bot.yml, so the
          # header's claim that every workflow file we ship at least parses was
          # false for one of them. `git ls-files` asks the repository instead.
          set -euo pipefail
          mapfile -t YAML_FILES < <(
            git ls-files 'Adapters/**/*.yml' 'Adapters/**/*.yaml' \
                         '.github/workflows/*.yml' '.github/workflows/*.yaml' | sort -u
          )
          if [ "${#YAML_FILES[@]}" -eq 0 ]; then
            echo "::error::No YAML files found under Adapters/ or .github/workflows/. Zero matches means the layout changed and this check would otherwise pass without parsing anything."
            exit 1
          fi
          fail=0
          for f in "${YAML_FILES[@]}"; do
            if npx --yes -q js-yaml "$f" > /dev/null 2>&1; then
              echo "OK: $f"
            else
              echo "::error::Invalid YAML syntax in $f"
              fail=1
            fi
          done
          echo "Parsed ${#YAML_FILES[@]} YAML files."
          exit "$fail"

  review-recorded:
    name: Review Recorded (advisory)
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Locate the framework
        id: locate
        run: |
          set -euo pipefail
          for candidate in . ia-engineering; do
            if [ -x "$candidate/Adapters/scripts/check-review-recorded.sh" ]; then
              echo "scripts=$candidate/Adapters/scripts" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::Could not locate Adapters/scripts/check-review-recorded.sh (looked in . and ia-engineering/). If the framework is imported at another path, adjust this workflow's Locate step."
          exit 1
      - name: Fetch the PR's review prose, then check for a recorded decision
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          IAENG_REVIEW_BOT_LOGIN: ${{ vars.IAENG_REVIEW_BOT_LOGIN }}
          SCRIPTS: ${{ steps.locate.outputs.scripts }}
        run: |
          # The host fetches; the script decides. The fetcher exits 3 when a
          # source could not be read, which is neither success nor failure: the
          # check must then report that nothing was established either way
          # rather than that no decision exists.
          COMMENTS="$RUNNER_TEMP/iaeng-review-comments"
          rc=0
          "$SCRIPTS/hosts/github/fetch-review-comments.sh" "$REPO" "$PR_NUMBER" "$COMMENTS" || rc=$?
          case "$rc" in
            0) "$SCRIPTS/check-review-recorded.sh" "$COMMENTS" ;;
            3) "$SCRIPTS/check-review-recorded.sh" "$COMMENTS" --fetch-incomplete ;;
            *) echo "::error::The review-comment fetcher failed outright (exit $rc). Nothing was read, so nothing is established."; exit 1 ;;
          esac

  risk-map:
    name: Risk Map (advisory)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Locate the framework
        id: locate
        run: |
          set -euo pipefail
          for candidate in . ia-engineering; do
            if [ -x "$candidate/Adapters/scripts/check-risk-map.sh" ]; then
              echo "scripts=$candidate/Adapters/scripts" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::Could not locate Adapters/scripts/check-risk-map.sh (looked in . and ia-engineering/)."
          exit 1
      - name: Verify the map, then classify this change set
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SCRIPTS: ${{ steps.locate.outputs.scripts }}
        run: |
          set -euo pipefail
          # The map is verified BEFORE it is used. A wrong map does not fail —
          # it classifies something important as ordinary, and the range check
          # below would then pass correctly on a false input.
          "$SCRIPTS/check-risk-map.sh" .
          "$SCRIPTS/check-risk-map.sh" --range "$BASE_SHA" "$HEAD_SHA" .

  script-tests:
    name: Script Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Locate the framework
        id: locate
        run: |
          set -euo pipefail
          for candidate in . ia-engineering; do
            if [ -x "$candidate/Adapters/scripts/tests/run.sh" ]; then
              echo "root=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::Could not locate Adapters/scripts/tests/run.sh (looked in . and ia-engineering/)."
          exit 1
      - name: Run the check-script behaviour tests
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          ./Adapters/scripts/tests/run.sh --verbose

  hook-tests:
    name: Hook Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Locate the framework
        id: locate
        run: |
          set -euo pipefail
          for candidate in . ia-engineering; do
            if [ -x "$candidate/Adapters/ai-runtimes/claude-code/hooks/tests/run.sh" ]; then
              echo "root=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::Could not locate Adapters/ai-runtimes/claude-code/hooks/tests/run.sh (looked in . and ia-engineering/)."
          exit 1
      - name: Run the runtime-hook behaviour tests
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          # Shellcheck proves the hooks are valid shell; the validator proves
          # the documents around them agree. Neither can say whether `git push
          # --force` is actually refused — that is behaviour, and seven real
          # defects and one false positive were found in it by hand. --verbose
          # so a green check shows every case by name rather than only an exit
          # status (Adapters/README.md, the Check Convention).
          ./Adapters/ai-runtimes/claude-code/hooks/tests/run.sh --verbose

  pr-size:
    name: PR Size
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the merge base is computable, and the head
          # checkout's .gitattributes is what `git check-attr` reads.
          fetch-depth: 0
          submodules: recursive
      - name: Locate the framework
        id: locate
        run: |
          set -euo pipefail
          for candidate in . ia-engineering; do
            if [ -x "$candidate/Adapters/scripts/check-pr-size.sh" ]; then
              echo "scripts=$candidate/Adapters/scripts" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::Could not locate Adapters/scripts/check-pr-size.sh (looked in . and ia-engineering/). If the framework is imported at another path, adjust this workflow's Locate step."
          exit 1
      - name: Count changed lines outside generated files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IAENG_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          SCRIPTS: ${{ steps.locate.outputs.scripts }}
        run: |
          "$SCRIPTS/check-pr-size.sh" "$BASE_SHA" "$HEAD_SHA"
